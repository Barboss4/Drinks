 img.src=urls[0];return img;
}
const E=(tag,cls,txt)=>{let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
const escapeHTML=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const picture=r=>visuals.find(([q])=>r.name.toLowerCase().includes(q))?.[1]||icons[r.category]||'🍸';
const toggleFav=id=>{favorites.has(id)?favorites.delete(id):favorites.add(id);try{localStorage.setItem('iuri-favs',JSON.stringify([...favorites]))}catch{}render(false)};
function go(next,cat='',id=null){page=next;category=cat;selected=id;filters={perfil:null,preparo:null,intensidade:null};query='';servings=1;history.pushState({page,category,selected},'',`#${page}/${encodeURIComponent(cat)}/${id||''}`);render()}
function heading(kicker,title,meta=''){const d=E('div','section-head');d.innerHTML=`<div><div class="overline">${escapeHTML(kicker)}</div><h2>${escapeHTML(title)}</h2></div><span class="smallmeta">${escapeHTML(meta)}</span>`;return d}
function drinkCards(rows){const grid=E('div','drink-grid');rows.forEach(r=>{const card=E('article','drink');const main=E('button','drink-main');main.innerHTML=`<div class="drink-visual"><span class="mini-label">${escapeHTML(r.method)}</span><b aria-hidden="true">${picture(r)}</b></div><div class="drink-info"><h3>${escapeHTML(r.name)}</h3><p>${escapeHTML(r.tags.slice(0,3).join(' · '))}</p><span class="drops">${'◆'.repeat(r.strength)}${'◇'.repeat(3-r.strength)} intensidade</span></div>`;main.querySelector('.drink-visual').append(photoElement(r,'drink-photo'));main.onclick=()=>{origin=page;go('recipe',r.category,r.id)};const fav=E('button','fav'+(favorites.has(r.id)?' on':''),favorites.has(r.id)?'♥':'♡');fav.setAttribute('aria-label','Alternar favorito');fav.onclick=()=>toggleFav(r.id);card.append(main,fav);grid.append(card)});if(!rows.length)return E('div','empty','Nenhuma receita encontrada. Tente outro termo ou filtro.');return grid}
function searchUI(placeholder){const outer=E('div','toolbar'),s=E('label','searchbox');s.innerHTML='<span aria-hidden="true">⌕</span>';const input=E('input');input.placeholder=placeholder;input.value=query;input.setAttribute('aria-label',placeholder);input.oninput=()=>{query=input.value;updateResults()};s.append(input);outer.append(s);return outer}
function updateResults(){const target=document.getElementById('results');if(!target)return;let rows=flat.filter(r=>page==='favorites'?favorites.has(r.id):page==='category'?r.category===category:true);
if(filters.perfil)rows=rows.filter(r=>r.tags.includes(filters.perfil));
if(filters.preparo)rows=rows.filter(r=>r.method.toLowerCase()===filters.preparo);
if(filters.intensidade)rows=rows.filter(r=>r.strength===filters.intensidade);
if(query.trim()){const q=query.toLocaleLowerCase('pt-BR').trim();rows=rows.filter(r=>[r.name,r.category,...r.ingredients,...r.tags].join(' ').toLocaleLowerCase('pt-BR').includes(q))}
target.replaceChildren(drinkCards(rows));const count=document.getElementById('resultCount');if(count)count.textContent=`${rows.length} receita${rows.length===1?'':'s'}`;
const reset=document.getElementById('clearFilters');if(reset)reset.hidden=!Object.values(filters).some(Boolean);
}
function listPage(){
app.append(E('button','crumb', '← Todas as categorias'));app.lastChild.onclick=()=>go('home');
let title=page==='favorites'?'Seus favoritos':page==='category'?category:'Todas as receitas';
app.append(heading('Coleção de coquetéis',title));app.append(searchUI('Buscar por nome, ingrediente ou sabor...'));
const panel=E('section','filter-panel');panel.setAttribute('aria-label','Filtros de drinks');
const top=E('div','filter-panel-top');top.innerHTML='<div><span class="overline">Personalize sua escolha</span><h3>Filtre os drinks</h3></div>';
const clear=E('button','clear-filters','Limpar filtros');clear.id='clearFilters';clear.onclick=()=>{filters={perfil:null,preparo:null,intensidade:null};listFiltersRefresh();updateResults()};top.append(clear);panel.append(top);
const groups=[{key:'perfil',label:'1. Perfil de sabor',opts:[['cítrico','🍋 Cítrico'],['frutado','🍊 Frutado'],['doce','🍯 Doce'],['refrescante','🌿 Refrescante'],['seco','🫒 Seco'],['amargo','🍊 Amargo'],['cremoso','🍦 Cremoso']]},{key:'preparo',label:'2. Tipo de preparo',opts:[['batido','🥄 Batido'],['misturado','🍹 Misturado'],['montado','🥃 Montado']]},{key:'intensidade',label:'3. Intensidade',opts:[[1,'◆ Leve'],[2,'◆◆ Médio'],[3,'◆◆◆ Forte']]}];
function listFiltersRefresh(){panel.querySelectorAll('[data-filter-key]').forEach(b=>{const active=filters[b.dataset.filterKey]=== (b.dataset.filterKey==='intensidade'?Number(b.dataset.filterValue):b.dataset.filterValue);b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))})}
groups.forEach(g=>{const group=E('div','filter-group');const label=E('h4','filter-label',g.label);group.append(label);const chips=E('div','chips');g.opts.forEach(([value,label])=>{const b=E('button','chip',label);b.dataset.filterKey=g.key;b.dataset.filterValue=value;b.type='button';b.onclick=()=>{filters[g.key]=filters[g.key]===value?null:value;listFiltersRefresh();updateResults()};chips.append(b)});group.append(chips);panel.append(group)});
app.append(panel);listFiltersRefresh();
app.append(heading('Explore os drinks','Escolha sua receita', ''));app.lastChild.querySelector('.smallmeta').id='resultCount';const out=E('div');out.id='results';app.append(out);updateResults()
}
function home(){const launch=E('button','pantry-banner');launch.innerHTML='<span class="pantry-icon">◫</span><span><strong>O que dá pra fazer?</strong><small>Marque o que tem em casa e veja as receitas possíveis.</small></span><span class="pantry-chevron">↗</span>';launch.onclick=()=>go('pantry');app.append(launch);app.append(searchUI('Qual drink ou ingrediente você procura?'));app.append(heading('Comece por aqui','Escolha sua bebida-base',`${flat.length} receitas`));const grid=E('div','category-grid');catalog.forEach(c=>{const n=flat.filter(r=>r.category===c.name).length;const b=E('button','category');b.innerHTML=`<span class="cat-emoji" aria-hidden="true">${icons[c.name]}</span><span class="catname">${escapeHTML(c.name)}</span><span class="catcount">${n} receitas</span><span class="cat-arrow">↗</span>`;b.onclick=()=>go('category',c.name);grid.append(b)});app.append(grid);app.append(heading('Para se inspirar','Do meu caderno','Os clássicos'));app.append(drinkCards(['Caipirinha','Negroni','Mojito','Margarita','Old Fashioned','Aperol Spritz'].map(n=>flat.find(r=>r.name===n)).filter(Boolean)));const search=app.querySelector('input');search.oninput=()=>{query=search.value;if(query.trim())goSearch(query)} }
function goSearch(q){page='all';query=q;app.replaceChildren();listPage();app.querySelector('input').focus();app.querySelector('input').setSelectionRange(q.length,q.length)}
function scaledIngredient(item,n){if(n===1)return item;return item.replace(/\d+(?:[.,]\d+)?/g,(v,offset,str)=>{if(offset>0&&/\w/.test(str[offset-1]))return v;const val=parseFloat(v.replace(',','.'))*n;return Number.isInteger(val)?String(val):String(Math.round(val*10)/10).replace('.',',')})}

function pantryPage(){
 const head=E('div','pantry-heading');head.innerHTML='<span class="overline">INVENTÁRIO PESSOAL</span><h2>Minha bancada.</h2><p>Monte seu estoque: comece pelas bebidas e marque depois os ingredientes que tem em casa. Vou mostrar os drinks que você consegue preparar.</p>';app.append(head);
 const tools=E('div','pantry-tools');const search=E('input','pantry-search');search.type='search';search.placeholder='Buscar ingrediente (gin, limão, gelo...)';search.setAttribute('aria-label','Buscar ingrediente');const clear=E('button','pantry-clear','Limpar seleção');clear.onclick=()=>{if(confirm('Limpar todos os ingredientes marcados?')){pantryOwned.clear();savePantry();drawIngredients();drawMatches()}};tools.append(search,clear);app.append(tools);
 const status=E('div','pantry-status');app.append(status);
 const picked=E('div','pantry-picked');app.append(picked);
 const ingBox=E('div','pantry-ingredients');app.append(ingBox);
 const matchHeader=E('div','pantry-results-heading');app.append(matchHeader);
 const modeWrap=E('div','pantry-modes');const onlyExact=E('button','pantry-mode active','Tenho tudo');const oneMissing=E('button','pantry-mode','Falta 1 ingrediente');modeWrap.append(onlyExact,oneMissing);app.append(modeWrap);let mode=0;
 const output=E('div');app.append(output);
 const pantryGroups=[
  {title:'Bebidas alcoólicas',icon:'🥃',description:'Destilados, vinhos, licores e aperitivos',match:/\b(cachaça|vodka|gin|gim|rum|tequila|whisky|whiskey|bourbon|scotch|conhaque|brandy|espumante|prosecco|champagne|vinho|cerveja|licor|campari|aperol|vermute|vermouth|fernet|amaretto|absinto|chartreuse|galliano|maraschino|benedictine|bénédictine|lillet|sake|saquê|pisco|cointreau|curaçao|curacao|triple sec|creme de cassis|crème de cassis)\b/i},
  {title:'Frutas e ervas',icon:'🍋',description:'Frutas frescas, folhas e guarnições',match:/\b(limão|lima|laranja|abacaxi|morango|maracujá|kiwi|maçã|maca|pêssego|pes sego|uva|cereja|cranberry|framboesa|mirtilo|melancia|hortelã|manjericão|alecrim|pepino|fruta|aipo|coco ralado|casca de|rodela de)\b/i},
  {title:'Sucos, refrigerantes e água',icon:'🥤',description:'Misturas não alcoólicas e bebidas gaseificadas',match:/\b(suco|néctar|nectar|água|agua|tônica|tonica|refrigerante|cola|soda|ginger beer|ginger ale|energético|energetico|chá|cha|café|cafe|espresso|kombucha)\b/i},
  {title:'Xaropes e adoçantes',icon:'🍯',description:'Xaropes, açúcar, mel e outros adoçantes',match:/\b(xarope|açúcar|acucar|mel|agave|grenadine|cordial|caramelo|adoçante|adocante)\b/i},
  {title:'Leites, cremes e ovos',icon:'🥛',description:'Ingredientes para receitas cremosas',match:/\b(leite|creme|nata|iogurte|sorvete|clara|ovo|aquafaba)\b/i},
  {title:'Temperos e complementos',icon:'🧂',description:'Gelo, especiarias e finalizações',match:/\b(gelo|gengibre|canela|cravo|pimenta|sal|bitters|angostura|molho|noz|chocolate|cacau|baunilha|raspas|água de flor|agua de flor)\b/i}
 ];
 function pantryGroupFor(item){const name=stripAccents(item);if(/^(suco|néctar|nectar|água|agua|ginger beer|ginger ale|refrigerante|soda)/i.test(item))return 'Sucos, refrigerantes e água';if(/^(xarope|cordial)/i.test(item))return 'Xaropes e adoçantes';for(const g of pantryGroups){if(g.match.test(item)||g.match.test(name))return g.title}return 'Outros ingredientes'}
 function drawIngredients(){
  const q=stripAccents(search.value.trim());ingBox.replaceChildren();
  const visible=pantryItems.filter(x=>stripAccents(x).includes(q));
  const groups=[...pantryGroups,{title:'Outros ingredientes',icon:'📦',description:'Itens adicionais das receitas'}];
  for(const group of groups){const items=visible.filter(x=>pantryGroupFor(x)===group.title);if(!items.length)continue;
   const section=E('section','pantry-section');const header=E('div','pantry-section-head');const title=E('div','pantry-section-title');
   title.innerHTML=`<span class="pantry-section-icon" aria-hidden="true">${group.icon}</span><div><h3>${group.title}</h3><p>${group.description}</p></div>`;
   const count=E('span','pantry-count',`${items.filter(x=>pantryOwned.has(x)).length}/${items.length} marcados`);header.append(title,count);section.append(header);
   const content=E('div','pantry-section-items');items.forEach(ing=>{const b=E('button','ingredient-toggle'+(pantryOwned.has(ing)?' chosen':''),ing);b.type='button';b.setAttribute('aria-pressed',String(pantryOwned.has(ing)));b.onclick=()=>{pantryOwned.has(ing)?pantryOwned.delete(ing):pantryOwned.add(ing);savePantry();drawIngredients();drawMatches()};content.append(b)});section.append(content);ingBox.append(section);
  }
  if(!visible.length)ingBox.append(E('p','pantry-muted','Nenhum ingrediente encontrado.'));
  status.textContent=`${pantryOwned.size} ingredientes selecionados · ${pantryItems.length} disponíveis`;
  picked.replaceChildren();const owned=[...pantryOwned].sort((a,b)=>a.localeCompare(b,'pt-BR'));if(owned.length){picked.append(E('span','pantry-muted','Selecionados (toque para remover):'));owned.forEach(v=>{const t=E('button','owned-chip',v+' ×');t.onclick=()=>{pantryOwned.delete(v);savePantry();drawIngredients();drawMatches()};picked.append(t)})}
 }

 function drawMatches(){const matches=flat.map(r=>({r,missing:pantryMissing(r)})).filter(x=>x.missing.length===mode).sort((a,b)=>a.r.name.localeCompare(b.r.name,'pt-BR'));matchHeader.innerHTML=`<div><span class="overline">RESULTADO DO INVENTÁRIO</span><h2>${matches.length} receita${matches.length===1?'':'s'}</h2></div>`;output.replaceChildren();if(!pantryOwned.size){output.append(E('div','empty','Marque seus ingredientes acima para descobrir o que consegue preparar.'));return}if(!matches.length){output.append(E('div','empty',mode===0?'Ainda não há receitas completas com a sua seleção. Marque mais ingredientes ou consulte “Falta 1 ingrediente”.':'Nenhuma receita com exatamente um ingrediente faltando.'));return}const cards=E('div','drink-grid');matches.forEach(({r,missing})=>{const tile=E('article','drink pantry-drink');const b=E('button','drink-main');b.innerHTML=`<div class="drink-visual"><span class="mini-label">${escapeHTML(r.method)}</span><b>${picture(r)}</b></div><div class="drink-info"><h3>${escapeHTML(r.name)}</h3><p>${escapeHTML(r.category)}</p><span class="pantry-availability">${missing.length?'Falta: '+escapeHTML(missing.join(', ')):'✓ Você tem os ingredientes'}</span></div>`;b.querySelector('.drink-visual').append(photoElement(r,'drink-photo'));b.onclick=()=>go('recipe',r.category,r.id);tile.append(b);cards.append(tile)});output.append(cards)}
 search.oninput=drawIngredients;onlyExact.onclick=()=>{mode=0;onlyExact.classList.add('active');oneMissing.classList.remove('active');drawMatches()};oneMissing.onclick=()=>{mode=1;oneMissing.classList.add('active');onlyExact.classList.remove('active');drawMatches()};drawIngredients();drawMatches();
}
function recipePage(){const r=flat.find(x=>x.id===selected);if(!r){go('home');return}const back=E('button','crumb',`← ${r.category}`);back.onclick=()=>go('category',r.category);app.append(back);const layout=E('div','recipe-layout');const art=E('div','recipe-art');art.innerHTML=`<span class="decor">Caderno do Iuri · Receita</span><span class="symbol" aria-hidden="true">${picture(r)}</span><span class="edition">Escolha, prepare, aproveite</span>`;art.prepend(photoElement(r,'recipe-photo'));const p=E('article','recipe-panel');p.innerHTML=`<div class="panel-top"><span class="overline">${escapeHTML(r.category)}</span><button class="heartbtn ${favorites.has(r.id)?'on':''}" id="heart">${favorites.has(r.id)?'♥ Salvo':'♡ Salvar'}</button></div><h2>${escapeHTML(r.name)}</h2><p class="recipe-description">Uma receita para preparar em casa. Separe os ingredientes e siga cada etapa.</p><div class="recipe-tags"><span>◈ ${escapeHTML(r.method)}</span><span>${'◆'.repeat(r.strength)}${'◇'.repeat(3-r.strength)} intensidade</span>${r.tags.slice(0,3).map(t=>`<span>${escapeHTML(t)}</span>`).join('')}</div><div class="servings"><div><small>QUANTIDADE</small><div style="font-weight:800;margin-top:3px">Porções</div></div><div class="stepper"><button id="minus" aria-label="Diminuir porções">−</button><span id="servings">1</span><button id="plus" aria-label="Aumentar porções">+</button></div></div><h3 class="panel-title">Ingredientes</h3><ul class="ingredients" id="ingredients"></ul><h3 class="panel-title">Modo de preparo</h3><ol class="steps">${r.steps.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ol><div class="disclaimer">As quantidades são referências para preparo caseiro. Ajuste gelo, açúcar e diluição ao seu gosto. Para receitas com clara, prefira o produto pasteurizado.</div>`;p.querySelector('#heart').onclick=()=>toggleFav(r.id);function update(){p.querySelector('#servings').textContent=servings;const ul=p.querySelector('#ingredients');ul.replaceChildren();r.ingredients.forEach(s=>ul.append(E('li','',scaledIngredient(s,servings))))}p.querySelector('#minus').onclick=()=>{servings=Math.max(1,servings-1);update()};p.querySelector('#plus').onclick=()=>{servings=Math.min(12,servings+1);update()};update();layout.append(art,p);app.append(layout)}
function render(scroll=true){app.replaceChildren();if(page==='home')home();else if(page==='recipe')recipePage();else if(page==='pantry')pantryPage();else listPage();document.querySelectorAll('.bottom-inner button').forEach(b=>b.classList.remove('selected'));const which=page==='home'?'bottomHome':page==='favorites'?'bottomFav':'bottomAll';document.getElementById(which).classList.add('selected');if(scroll)window.scrollTo({top:0,behavior:'instant'})}
document.getElementById('navHome').onclick=()=>go('home');document.getElementById('navPantry').onclick=()=>go('pantry');document.getElementById('navFav').onclick=()=>go('favorites');document.getElementById('bottomHome').onclick=()=>go('home');document.getElementById('bottomAll').onclick=()=>go('all');document.getElementById('bottomFav').onclick=()=>go('favorites');window.addEventListener('popstate',e=>{const s=e.state||{page:'home',category:'',selected:null};page=s.page;category=s.category;selected=s.selected;query='';filters={perfil:null,preparo:null,intensidade:null};render()});history.replaceState({page,category,selected},'','#home');render();
</script></body></html>
